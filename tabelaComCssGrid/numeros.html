<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade de Layouts (Tabela e Grid)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="page-title">Atividade de Layouts (Table & Display Grid)</h1>

    <div class="grid-page">

        <!-- EXERCÍCIO 1 (Canto Superior Esquerdo - Quadro 1): Tabela Simples (usando TR e TD, como pedido) -->
        <div class="exercise-box table-container">
            <h3>Tabela Simples (tr e td)</h3>
            <table>
                <tr>
                    <td><img src="imgs/1.jpg" alt="1"></td>
                    <td><img src="imgs/2.jpg" alt="2"></td>
                    <td><img src="imgs/3.jpg" alt="3"></td>
                </tr>
                <tr>
                    <td><img src="imgs/4.jpg" alt="4"></td>
                    <td><img src="imgs/5.jpg" alt="5"></td>
                    <td><img src="imgs/6.jpg" alt="6"></td>
                </tr>
                <tr>
                    <td><img src="imgs/7.jpg" alt="7"></td>
                    <td><img src="imgs/8.jpg" alt="8"></td>
                    <td><img src="imgs/9.jpg" alt="9"></td>
                </tr>
            </table>
        </div>

        <!-- EXERCÍCIO 2 (Canto Superior Direito - Quadro 2): Grid 3x3 com Item 1 estendido -->
        <div class="exercise-box grid-ex-2">
            <h3>Grid 3x3 (Item 1 estendido)</h3>
            <div class="grid-container">
                <div class="item1"><img src="imgs/1.jpg" alt="1"></div>
                <div class="item2"><img src="imgs/2.jpg" alt="2"></div>
                <div class="item3"><img src="imgs/3.jpg" alt="3"></div>
                <div class="item4"><img src="imgs/4.jpg" alt="4"></div>
                <div class="item5"><img src="imgs/5.jpg" alt="5"></div>
                <div class="item6"><img src="imgs/6.jpg" alt="6"></div>
                <div class="item7"><img src="imgs/7.jpg" alt="7"></div>
            </div>
        </div>

        <!-- EXERCÍCIO 3 (Canto Superior Direito - Quadro 3): Header + 3 Colunas -->
        <div class="exercise-box grid-ex-3">
            <h3>Header + 3 Colunas</h3>
            <div class="grid-container">
                <div class="item1"><img src="imgs/1.jpg" alt="1"></div>
                <div class="item2"><img src="imgs/2.jpg" alt="2"></div>
                <div class="item3"><img src="imgs/3.jpg" alt="3"></div>
                <div class="item4"><img src="imgs/4.jpg" alt="4"></div>
            </div>
        </div>

        <!-- EXERCÍCIO 4 (Canto Inferior Esquerdo - Quadro 4): Grid 3x3 com Item 8 estendido -->
        <div class="exercise-box grid-ex-4">
            <h3>Grid 3x3 (Item 8 estendido)</h3>
            <div class="grid-container">
                <div class="item1"><img src="imgs/1.jpg" alt="1"></div>
                <div class="item2"><img src="imgs/2.jpg" alt="2"></div>
                <div class="item3"><img src="imgs/3.jpg" alt="3"></div>
                <div class="item4"><img src="imgs/4.jpg" alt="4"></div>
                <div class="item5"><img src="imgs/5.jpg" alt="5"></div>
                <div class="item6"><img src="imgs/6.jpg" alt="6"></div>
                <div class="item7"><img src="imgs/7.jpg" alt="7"></div>
                <div class="item8"><img src="imgs/8.jpg" alt="8"></div>
            </div>
        </div>

        <!-- EXERCÍCIO 5 (Canto Inferior Meio - Quadro 5): Coluna Central Alta -->
        <div class="exercise-box grid-ex-5">
            <h3>Coluna Central Alta</h3>
            <div class="grid-container">
                <div class="item1"><img src="imgs/1.jpg" alt="1"></div>
                <div class="item2"><img src="imgs/2.jpg" alt="2"></div>
                <div class="item3"><img src="imgs/3.jpg" alt="3"></div>
                <div class="item4"><img src="imgs/4.jpg" alt="4"></div>
                <div class="item5"><img src="imgs/5.jpg" alt="5"></div>
                <div class="item6"><img src="imgs/6.jpg" alt="6"></div>
                <div class="item7"><img src="imgs/7.jpg" alt="7"></div>
            </div>
        </div>

        <!-- EXERCÍCIO 6 (Canto Inferior Direito - Quadro 6): Layout de 4 Blocos -->
        <div class="exercise-box grid-ex-6">
            <h3>Layout de 4 Blocos</h3>
            <div class="grid-container">
                <div class="item1"><img src="imgs/1.jpg" alt="1"></div>
                <div class="item2"><img src="imgs/2.jpg" alt="2"></div>
                <div class="item3"><img src="imgs/3.jpg" alt="3"></div>
                <div class="item4"><img src="imgs/4.jpg" alt="4"></div>
            </div>
        </div>

    </div>

</body>
</html>
